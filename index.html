<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sticky Board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23ffe566'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Patrick+Hand&family=Syne:wght@700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css?v=21" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="mark">Sticky Board</p>
          <p class="tag">Type / for a shape, a drawing, a game, or the table.</p>
        </div>
        <p class="status status-loading" id="status"><span class="dot"></span><span id="status-text">Connecting</span></p>
      </header>

      <div class="board" id="board">
        <p class="hint" id="hint" hidden>The wall is empty. Stick the first note.</p>
        <div class="note ghost" id="ghost" hidden><span class="note-text"></span></div>
        <div id="peers"></div>
        <div class="dock" id="dock">
          <input id="name-input" maxlength="20" placeholder="Guest" aria-label="Your name" />
          <p class="coords" id="coords">x 0 · y 0</p>
        </div>
        <div class="paintbar" id="paintbar" hidden>
          <button type="button" class="ink on" data-ink="#1C1917" style="background:#1C1917" aria-label="Black"></button>
          <button type="button" class="ink" data-ink="#E11D48" style="background:#E11D48" aria-label="Red"></button>
          <button type="button" class="ink" data-ink="#2563EB" style="background:#2563EB" aria-label="Blue"></button>
          <button type="button" class="ink" data-ink="#16A34A" style="background:#16A34A" aria-label="Green"></button>
          <button type="button" class="ink" data-ink="#F8F7F4" style="background:#F8F7F4" aria-label="White"></button>
          <button type="button" class="size on" data-size="4">S</button>
          <button type="button" class="size" data-size="10">M</button>
          <button type="button" class="size" data-size="22">L</button>
          <button type="button" id="eraser">Eraser</button>
          <span id="paint-coords">0, 0</span>
          <button type="button" id="paint-done">Done</button>
        </div>
        <p class="tip" id="tip" hidden>Press I to draw</p>
      </div>

      <form class="composer" id="composer">
        <ul class="suggest" id="suggest" hidden></ul>
        <p class="error" id="error" hidden></p>
        <label class="field">
          <span class="sr">Note</span>
          <input id="note-input" maxlength="100" placeholder="Type a note" />
          <span class="count" id="count">0/100</span>
        </label>
        <div class="colors" id="colors" role="listbox" aria-label="Note color"></div>
        <p class="place-hint" id="place-hint">Type /, then Tab. Click the wall to place it.</p>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="src/board.js?v=28"></script>
  </body>
</html>
