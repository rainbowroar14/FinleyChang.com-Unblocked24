<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elements</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1c1917;
        --muted: #57534e;
        --line: #e7e5e4;
        --paper: #fafaf9;
        --card: #ffffff;
        --alkali: #fb923c;
        --earth: #facc15;
        --transition: #38bdf8;
        --post: #a78bfa;
        --metalloid: #4ade80;
        --nonmetal: #f9a8d4;
        --halogen: #fb7185;
        --noble: #94a3b8;
        --lanthanide: #f472b6;
        --actinide: #e879f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: end;
        justify-content: space-between;
        padding: 28px 24px 8px;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: -0.04em;
      }
      p { margin: 6px 0 0; color: var(--muted); }
      a { color: inherit; }
      input {
        width: min(320px, 100%);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 12px 16px;
        font: inherit;
        background: white;
      }
      main { padding: 8px 24px 48px; }
      .detail {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 18px;
        align-items: center;
        margin: 16px 0;
        padding: 16px;
        border-radius: 18px;
        background: white;
        box-shadow: 0 10px 30px rgba(28, 25, 23, 0.06);
      }
      .badge {
        width: 92px;
        height: 92px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-size: 36px;
        font-weight: 750;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .stats span {
        min-width: 92px;
        padding: 8px 10px;
        border-radius: 12px;
        background: var(--paper);
      }
      .stats b { display: block; font-size: 18px; }
      .stats small { color: var(--muted); }
      .board {
        overflow-x: auto;
        padding-bottom: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(18, 58px);
        grid-auto-rows: 58px;
        gap: 4px;
        width: max-content;
      }
      .spacer { grid-column: 1 / -1; height: 18px; }
      button.cell {
        border: 0;
        border-radius: 8px;
        padding: 4px;
        text-align: left;
        cursor: pointer;
        color: #1c1917;
        font: inherit;
      }
      button.cell b { display: block; font-size: 16px; line-height: 1; }
      button.cell small { font-size: 10px; }
      button.cell.on { outline: 2px solid #1c1917; outline-offset: 1px; }
      button.cell.hide { opacity: 0.18; }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 14px 0;
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        margin-right: 6px;
        border-radius: 99px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 16px;
        overflow: hidden;
      }
      th, td {
        padding: 10px 12px;
        text-align: left;
        border-bottom: 1px solid var(--line);
      }
      th { font-size: 13px; color: var(--muted); }
      tr.hide { display: none; }
      tr.on { background: #fff7ed; }
      tbody tr { cursor: pointer; }
      @media (max-width: 720px) {
        header, main { padding-left: 14px; padding-right: 14px; }
        .detail { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Elements</h1>
        <p>Symbol, protons, neutrons, electrons, and mass number. <a href="index.html">Back to the wall</a></p>
      </div>
      <input id="q" type="search" placeholder="Search name or symbol" aria-label="Search elements" />
    </header>
    <main>
      <section class="detail" id="detail"></section>
      <div class="legend" id="legend"></div>
      <div class="board"><div class="grid" id="grid"></div></div>
      <table>
        <thead>
          <tr>
            <th>Element</th>
            <th>Symbol</th>
            <th>Protons</th>
            <th>Neutrons</th>
            <th>Electrons</th>
            <th>Mass #</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script>
      const elements = [
        ["Hydrogen","H",1,0,1,1],["Helium","He",2,2,2,4],["Lithium","Li",3,4,3,7],["Beryllium","Be",4,5,4,9],
        ["Boron","B",5,6,5,11],["Carbon","C",6,6,6,12],["Nitrogen","N",7,7,7,14],["Oxygen","O",8,8,8,16],
        ["Fluorine","F",9,10,9,19],["Neon","Ne",10,10,10,20],["Sodium","Na",11,12,11,23],["Magnesium","Mg",12,12,12,24],
        ["Aluminum","Al",13,14,13,27],["Silicon","Si",14,14,14,28],["Phosphorus","P",15,16,15,31],["Sulfur","S",16,16,16,32],
        ["Chlorine","Cl",17,18,17,35],["Argon","Ar",18,22,18,40],["Potassium","K",19,20,19,39],["Calcium","Ca",20,20,20,40],
        ["Scandium","Sc",21,24,21,45],["Titanium","Ti",22,26,22,48],["Vanadium","V",23,28,23,51],["Chromium","Cr",24,28,24,52],
        ["Manganese","Mn",25,30,25,55],["Iron","Fe",26,30,26,56],["Cobalt","Co",27,32,27,59],["Nickel","Ni",28,30,28,58],
        ["Copper","Cu",29,34,29,63],["Zinc","Zn",30,34,30,64],["Gallium","Ga",31,38,31,69],["Germanium","Ge",32,42,32,74],
        ["Arsenic","As",33,42,33,75],["Selenium","Se",34,46,34,80],["Bromine","Br",35,44,35,79],["Krypton","Kr",36,48,36,84],
        ["Rubidium","Rb",37,48,37,85],["Strontium","Sr",38,50,38,88],["Yttrium","Y",39,50,39,89],["Zirconium","Zr",40,50,40,90],
        ["Niobium","Nb",41,52,41,93],["Molybdenum","Mo",42,56,42,98],["Technetium","Tc",43,55,43,98],["Ruthenium","Ru",44,58,44,102],
        ["Rhodium","Rh",45,58,45,103],["Palladium","Pd",46,60,46,106],["Silver","Ag",47,60,47,107],["Cadmium","Cd",48,66,48,114],
        ["Indium","In",49,66,49,115],["Tin","Sn",50,70,50,120],["Antimony","Sb",51,70,51,121],["Tellurium","Te",52,78,52,130],
        ["Iodine","I",53,74,53,127],["Xenon","Xe",54,78,54,132],["Cesium","Cs",55,78,55,133],["Barium","Ba",56,82,56,138],
        ["Lanthanum","La",57,82,57,139],["Cerium","Ce",58,82,58,140],["Praseodymium","Pr",59,82,59,141],["Neodymium","Nd",60,82,60,142],
        ["Promethium","Pm",61,84,61,145],["Samarium","Sm",62,90,62,152],["Europium","Eu",63,90,63,153],["Gadolinium","Gd",64,94,64,158],
        ["Terbium","Tb",65,94,65,159],["Dysprosium","Dy",66,98,66,164],["Holmium","Ho",67,98,67,165],["Erbium","Er",68,98,68,166],
        ["Thulium","Tm",69,100,69,169],["Ytterbium","Yb",70,104,70,174],["Lutetium","Lu",71,104,71,175],["Hafnium","Hf",72,108,72,180],
        ["Tantalum","Ta",73,108,73,181],["Tungsten","W",74,110,74,184],["Rhenium","Re",75,112,75,187],["Osmium","Os",76,116,76,192],
        ["Iridium","Ir",77,116,77,193],["Platinum","Pt",78,117,78,195],["Gold","Au",79,118,79,197],["Mercury","Hg",80,122,80,202],
        ["Thallium","Tl",81,124,81,205],["Lead","Pb",82,126,82,208],["Bismuth","Bi",83,126,83,209],["Polonium","Po",84,125,84,209],
        ["Astatine","At",85,125,85,210],["Radon","Rn",86,136,86,222],["Francium","Fr",87,136,87,223],["Radium","Ra",88,138,88,226],
        ["Actinium","Ac",89,138,89,227],["Thorium","Th",90,142,90,232],["Protactinium","Pa",91,140,91,231],["Uranium","U",92,146,92,238],
        ["Neptunium","Np",93,144,93,237],["Plutonium","Pu",94,150,94,244],["Americium","Am",95,148,95,243],["Curium","Cm",96,151,96,247],
        ["Berkelium","Bk",97,150,97,247],["Californium","Cf",98,153,98,251],["Einsteinium","Es",99,153,99,252],["Fermium","Fm",100,157,100,257],
        ["Mendelevium","Md",101,157,101,258],["Nobelium","No",102,157,102,259],["Lawrencium","Lr",103,163,103,266],["Rutherfordium","Rf",104,163,104,267],
        ["Dubnium","Db",105,163,105,268],["Seaborgium","Sg",106,163,106,269],["Bohrium","Bh",107,163,107,270],["Hassium","Hs",108,161,108,269],
        ["Meitnerium","Mt",109,169,109,278],["Darmstadtium","Ds",110,171,110,281],["Roentgenium","Rg",111,171,111,282],["Copernicium","Cn",112,173,112,285],
        ["Nihonium","Nh",113,173,113,286],["Flerovium","Fl",114,175,114,289],["Moscovium","Mc",115,175,115,290],["Livermorium","Lv",116,177,116,293],
        ["Tennessine","Ts",117,177,117,294],["Oganesson","Og",118,176,118,294]
      ].map(([name, symbol, protons, neutrons, electrons, mass]) => ({ name, symbol, protons, neutrons, electrons, mass }))

      const groups = {
        alkali: ["#fb923c", "Alkali metal"],
        earth: ["#facc15", "Alkaline earth"],
        transition: ["#38bdf8", "Transition metal"],
        post: ["#a78bfa", "Post-transition"],
        metalloid: ["#4ade80", "Metalloid"],
        nonmetal: ["#f9a8d4", "Nonmetal"],
        halogen: ["#fb7185", "Halogen"],
        noble: ["#94a3b8", "Noble gas"],
        lanthanide: ["#f472b6", "Lanthanide"],
        actinide: ["#e879f9", "Actinide"]
      }
      const kindOf = {
        H: "nonmetal", Li: "alkali", Na: "alkali", K: "alkali", Rb: "alkali", Cs: "alkali", Fr: "alkali",
        Be: "earth", Mg: "earth", Ca: "earth", Sr: "earth", Ba: "earth", Ra: "earth",
        B: "metalloid", Si: "metalloid", Ge: "metalloid", As: "metalloid", Sb: "metalloid", Te: "metalloid",
        C: "nonmetal", N: "nonmetal", O: "nonmetal", P: "nonmetal", S: "nonmetal", Se: "nonmetal",
        F: "halogen", Cl: "halogen", Br: "halogen", I: "halogen", At: "halogen", Ts: "halogen",
        He: "noble", Ne: "noble", Ar: "noble", Kr: "noble", Xe: "noble", Rn: "noble", Og: "noble",
        Al: "post", Ga: "post", In: "post", Sn: "post", Tl: "post", Pb: "post", Bi: "post", Po: "post",
        Nh: "post", Fl: "post", Mc: "post", Lv: "post"
      }
      function kind(el) {
        if (kindOf[el.symbol]) return kindOf[el.symbol]
        if (el.protons >= 57 && el.protons <= 71) return "lanthanide"
        if (el.protons >= 89 && el.protons <= 103) return "actinide"
        return "transition"
      }
      function spot(z) {
        if (z === 1) return [1, 1]
        if (z === 2) return [1, 18]
        if (z <= 4) return [2, z - 2]
        if (z <= 10) return [2, z + 8]
        if (z <= 12) return [3, z - 10]
        if (z <= 18) return [3, z]
        if (z <= 36) return [4, z - 18]
        if (z <= 54) return [5, z - 36]
        if (z === 55) return [6, 1]
        if (z === 56) return [6, 2]
        if (z <= 71) return [9, z - 54]
        if (z <= 86) return [6, z - 68]
        if (z === 87) return [7, 1]
        if (z === 88) return [7, 2]
        if (z <= 103) return [10, z - 86]
        return [7, z - 100]
      }

      const grid = document.getElementById("grid")
      const rows = document.getElementById("rows")
      const detail = document.getElementById("detail")
      const q = document.getElementById("q")
      let selected = 0

      const legend = document.getElementById("legend")
      for (const [key, [color, label]] of Object.entries(groups)) {
        const item = document.createElement("span")
        item.innerHTML = "<i style=\"background:" + color + "\"></i>" + label
        legend.appendChild(item)
      }

      const cells = elements.map((el, index) => {
        const [row, col] = spot(el.protons)
        const button = document.createElement("button")
        button.type = "button"
        button.className = "cell"
        button.style.gridRow = String(row)
        button.style.gridColumn = String(col)
        button.style.background = groups[kind(el)][0]
        button.innerHTML = "<small>" + el.protons + "</small><b>" + el.symbol + "</b>"
        button.addEventListener("click", () => select(index))
        grid.appendChild(button)
        const tr = document.createElement("tr")
        tr.innerHTML = "<td>" + el.name + "</td><td>" + el.symbol + "</td><td>" + el.protons + "</td><td>" + el.neutrons + "</td><td>" + el.electrons + "</td><td>" + el.mass + "</td>"
        tr.addEventListener("click", () => select(index))
        rows.appendChild(tr)
        return { button, tr }
      })

      const gap = document.createElement("div")
      gap.className = "spacer"
      gap.style.gridRow = "8"
      grid.appendChild(gap)

      function select(index) {
        selected = index
        const el = elements[index]
        detail.innerHTML =
          '<div class="badge" style="background:' + groups[kind(el)][0] + '">' + el.symbol + "</div>" +
          "<div><h2 style=\"margin:0\">" + el.name + "</h2><div class=\"stats\">" +
          stat("Protons", el.protons) + stat("Neutrons", el.neutrons) + stat("Electrons", el.electrons) + stat("Mass #", el.mass) +
          "</div></div>"
        paint()
      }
      function stat(label, value) {
        return "<span><small>" + label + "</small><b>" + value + "</b></span>"
      }
      function paint() {
        const query = q.value.trim().toLowerCase()
        cells.forEach((cell, index) => {
          const el = elements[index]
          const hit = !query || el.name.toLowerCase().includes(query) || el.symbol.toLowerCase().includes(query)
          cell.button.classList.toggle("hide", !hit)
          cell.button.classList.toggle("on", index === selected)
          cell.tr.classList.toggle("hide", !hit)
          cell.tr.classList.toggle("on", index === selected)
        })
      }
      q.addEventListener("input", () => {
        const query = q.value.trim().toLowerCase()
        const found = elements.findIndex((el) => el.name.toLowerCase().includes(query) || el.symbol.toLowerCase() === query || el.symbol.toLowerCase().includes(query))
        if (query && found >= 0) select(found)
        else paint()
      })
      select(0)
    </script>
  </body>
</html>
